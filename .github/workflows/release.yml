name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish
        run: dotnet publish Dexa/Dexa.csproj -c Release --self-contained -r win-x64 -o ./publish

      # scrcpy (patched build) and adb are committed in Dexa/scrcpy — without them the app starts but mirrors nothing.
      - name: Verify bundled scrcpy
        shell: pwsh
        run: |
          foreach ($f in 'scrcpy.exe','scrcpy-server','adb.exe','SDL3.dll','avcodec-62.dll') {
            if (-not (Test-Path "./publish/scrcpy/$f")) { throw "Missing publish/scrcpy/$f" }
          }

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Create Velopack package
        run: vpk pack --packId Dexa --packVersion ${{ env.VERSION }} --packDir ./publish --mainExe Dexa.exe --icon Dexa/Icons/Dexa.ico

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dexa ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Releases/Dexa-win-Setup.exe
            Releases/Dexa-win-Portable.zip
            Releases/Dexa-*-full.nupkg
            Releases/releases.win.json
            Releases/assets.win.json
            Releases/RELEASES
